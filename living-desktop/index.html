<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outpost · Living desktop</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; color: #e8dfc4; background: #0c191e; }
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; }
    #landscape, #life { position: fixed; inset: 0; width: 100%; height: 100%; }
    #landscape { object-fit: cover; }
    #life { pointer-events: none; }
    .heading { position: fixed; top: 30px; left: 36px; display: flex; align-items: center; gap: 13px; text-shadow: 0 2px 12px #000; }
    .wordmark { font-size: 15px; letter-spacing: .22em; font-weight: 600; }
    .tag { font-size: 9px; letter-spacing: .13em; color: #a1afa9; border-left: 1px solid #52605b; padding-left: 13px; }
    .live { position: fixed; right: 36px; top: 32px; font-size: 10px; letter-spacing: .12em; display: flex; gap: 9px; align-items: center; text-shadow: 0 2px 8px #000; }
    .dot { width: 5px; height: 5px; background: #d3ae78; box-shadow: 0 0 10px #d3ae7855; }
    .controls { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 8px; border: 1px solid #d3ae7833; border-radius: 8px; background: #102126eb; box-shadow: 0 6px 24px #0004; }
    button, select { font: inherit; font-size: 11px; color: #d8d4be; border: 1px solid transparent; background: transparent; padding: 9px 12px; border-radius: 4px; white-space: nowrap; cursor: pointer; }
    button:hover, select:hover { background: #253c41; color: #fff2d5; }
    button:focus-visible, select:focus-visible { outline: 2px solid #d3ae78; outline-offset: 2px; }
    button[aria-pressed="true"] { color: #d3ae78; background: #253c41; }
    .divider { height: 18px; width: 1px; background: #52605b66; margin: 0 3px; }
    .status { position: fixed; bottom: 31px; left: 36px; max-width: 235px; font-size: 10px; line-height: 1.7; color: #a1afa9; text-shadow: 0 2px 10px #000; }
    .status span { display: block; color: #d3ae78; font-size: 9px; letter-spacing: .1em; }
    .hint { position: fixed; bottom: 34px; right: 36px; font-size: 9px; color: #a1afa9; text-shadow: 0 2px 8px #000; }
    .hidden .chrome { display: none; }
    #load-error { position: fixed; inset: 40% 20% auto; background: #14282d; padding: 24px; border: 1px solid #d3ae78; line-height: 1.7; }
    @media (max-width: 950px) { .status, .hint { display: none; } }
    @media (max-width: 600px) { .heading { left: 18px; top: 20px; } .tag { display: none; } .live { right: 18px; top: 23px; } .controls { max-width: calc(100% - 24px); flex-wrap: wrap; justify-content: center; } button, select { padding: 8px; font-size: 10px; } .divider { display: none; } }
  </style>
</head>
<body>
  <img id="landscape" src="../backgrounds/13-forest-night.webp" alt="Avamposto nella foresta notturna, passerelle abitate da piccoli robot e una torre oltre la valle.">
  <canvas id="life" aria-label="Robot in ronda, droni corriere, lucciole, riflessi sul fiume ed eventi casuali animati."></canvas>
  <div class="heading chrome"><div class="wordmark">OUTPOST</div><div class="tag">LIVING DESKTOP / FOREST AT NIGHT</div></div>
  <div class="live chrome"><span class="dot"></span><span id="live-label">LA VALLE È SVEGLIA</span></div>
  <div class="status chrome"><span id="elapsed">RONDA · 00:00</span><div id="event-label" role="status">La ronda comincia</div></div>
  <div class="controls chrome" aria-label="Controlli della scena">
    <button id="pause" type="button" aria-pressed="false">Pausa</button>
    <span class="divider"></span>
    <button type="button" data-event="drone">Invia drone</button>
    <button type="button" data-event="repair">Manutenzione</button>
    <button type="button" data-event="meteor">Meteora</button>
    <span class="divider"></span>
    <select id="intensity" aria-label="Attività della valle"><option value="0.55">Quiete</option><option value="1" selected>Viva</option><option value="1.6">Più attività</option></select>
    <button id="hide" type="button">Solo sfondo</button>
    <button id="fullscreen" type="button">Schermo intero</button>
  </div>
  <div class="hint chrome">H · controlli &nbsp; SPAZIO · pausa</div>
  <div id="load-error" hidden>Impossibile caricare il paesaggio. Mantieni questa cartella accanto a <code>backgrounds/</code> e riapri l'anteprima.</div>
  <script src="scene.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const scene = createScene(params.has("seed") ? Number(params.get("seed")) : Date.now());
    const canvas = document.getElementById("life");
    const context = canvas.getContext("2d");
    const landscape = document.getElementById("landscape");
    const pauseButton = document.getElementById("pause");
    let paused = params.has("still") || matchMedia("(prefers-reduced-motion: reduce)").matches;
    let previous = performance.now();
    let paintedAt = 0;
    let statusAt = 0;
    const maximumFps = 24;
    if (params.get("wallpaper") === "1") document.body.classList.add("hidden");
    function resize() {
      // Bound the animated overlay; the original still image renders at full resolution.
      const ratio = Math.min(devicePixelRatio, 1920 / innerWidth);
      canvas.width = Math.round(innerWidth * ratio);
      canvas.height = Math.round(innerHeight * ratio);
      render();
    }
    function render() {
      context.clearRect(0, 0, canvas.width, canvas.height);
      context.imageSmoothingEnabled = false;
      scene.render(context, canvas.width, canvas.height,
        landscape.complete && landscape.naturalWidth ? landscape : null);
    }
    function status() {
      const state = scene.snapshot();
      const minutes = String(Math.floor(state.time / 60)).padStart(2, "0");
      const seconds = String(Math.floor(state.time % 60)).padStart(2, "0");
      document.getElementById("elapsed").textContent = "RONDA · " + minutes + ":" + seconds;
      document.getElementById("event-label").textContent = state.lastEvent;
      document.getElementById("live-label").textContent = paused ? "LA VALLE RIPOSA" : "LA VALLE È SVEGLIA";
      pauseButton.textContent = paused ? "Riprendi" : "Pausa";
      pauseButton.setAttribute("aria-pressed", String(paused));
    }
    function frame(now) {
      const dt = Math.min((now - previous) / 1000, 0.1);
      previous = now;
      if (!paused && !document.hidden) scene.update(dt);
      if (!paused && now - paintedAt >= 1000 / maximumFps) { render(); paintedAt = now; }
      if (now - statusAt >= 500) { status(); statusAt = now; }
      requestAnimationFrame(frame);
    }
    pauseButton.addEventListener("click", () => { paused = !paused; status(); });
    document.querySelectorAll("[data-event]").forEach(button => {
      button.addEventListener("click", () => { scene.trigger(button.dataset.event); render(); status(); });
    });
    document.getElementById("intensity").addEventListener("change", event => scene.setIntensity(Number(event.target.value)));
    document.getElementById("hide").addEventListener("click", () => document.body.classList.add("hidden"));
    document.getElementById("fullscreen").addEventListener("click", () => {
      const action = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
      action.catch(() => { document.getElementById("live-label").textContent = "USA LA MODALITÀ SCHERMO INTERO DEL BROWSER"; });
    });
    document.addEventListener("keydown", event => {
      if (event.target.matches("button, select")) return;
      if (event.key.toLowerCase() === "h" || event.key === "Escape") document.body.classList.toggle("hidden");
      if (event.code === "Space") { event.preventDefault(); paused = !paused; status(); }
    });
    document.addEventListener("visibilitychange", () => { previous = performance.now(); });
    landscape.addEventListener("load", render);
    landscape.addEventListener("error", () => { document.getElementById("load-error").hidden = false; });
    addEventListener("resize", resize);
    resize(); status(); requestAnimationFrame(frame);
  </script>
</body>
</html>
